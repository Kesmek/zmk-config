# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Mouse keys, for the &mkp / &mmv bindings on the mouse layer
CONFIG_ZMK_POINTING=y

# Split battery reporting. The right half is a BLE peripheral, so its level
# never reaches the host on its own — the host only ever sees the central.
# FETCHING pulls the peripheral level over to the central; PROXY republishes
# it to the host as a second battery report. Both are central-side options,
# but this .conf applies to both halves and the peripheral ignores them.
# Without these a dead right half looks identical to a healthy board.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Every event the central receives from the right half — each key press, each
# key release, and (since battery fetching above) each battery notification —
# goes through one shared queue, sized by this option and defaulting to 5:
#
#   app/src/split/bluetooth/central.c
#     K_MSGQ_DEFINE(peripheral_event_msgq, sizeof(struct peripheral_event_wrapper),
#                   CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE, 4);
#
# Every enqueue is k_msgq_put(&peripheral_event_msgq, &ev, K_NO_WAIT) with the
# return value discarded, so a full queue drops the event silently — there is no
# retry and no log. The queue drains on the system workqueue, so a burst that
# arrives faster than that workqueue is scheduled overflows five slots quickly:
# press and release each take a slot, and battery notifications now share them.
#
# A dropped release is the damaging case. The central never learns the key came
# up, so the key stays held in its state, and a held home-row mod resolves to the
# modifier. That reproduces as "fast typing on the right hand produces spurious
# mods" and cannot happen on the left, which is the central and never crosses
# this queue.
#
# 64 slots at roughly 24 bytes per wrapper is about 1.5KB of RAM on a part with
# 256KB. Cheap insurance against a silent, corrupting drop.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64

# If spurious mods survive the queue fix, the next suspect is the split link
# itself rather than the queue. Slave latency lets the peripheral skip up to 30
# connection events when idle; it transmits at the next anchor once it has data,
# so it should not delay a keystroke, but it does widen the resync window after a
# pause and that lands on the first key of a burst. Costs right-half battery, so
# it stays off until measurement justifies it.
# CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
