# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Mouse keys, for the &mkp / &mmv bindings on the mouse layer
CONFIG_ZMK_POINTING=y

# Split battery reporting. PROXY republishes the peripheral's battery level
# to the host as a second Battery Service — BlueZ's battery plugin can't
# handle two BAS instances on one device and drops the connection in a loop.
# Disabled; the host now only sees the central's battery.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Temporary troubleshooting: allow re-pairing to an occupied profile slot
# without clearing it first (auth_pairing_accept() in ZMK's ble.c otherwise
# rejects it outright). Revert once pairing is confirmed working again.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
